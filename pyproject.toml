[project]
name = "karimo"
version = "0.1.0"
description = "Recherche immobiliere a l'est de Bruxelles : cout reel, qualification, notation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karimo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # Bruit de starlette.testclient, sans rapport avec le code du projet.
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends() et Form() en valeur par defaut sont l'idiome FastAPI, pas un piege
# de mutable partage : B008 ne s'applique pas.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
